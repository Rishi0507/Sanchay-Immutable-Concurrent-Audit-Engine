# One-command bring-up (PRD DP-1):
#   docker compose -f deploy/docker-compose.yml up --build
#
# Services: db, ledger (OCaml), mcp (Go), engine (Python), ui.
#
# Loading the synthetic business with its historical record times needs the
# seeding clock, which is off unless started with SIM_CLOCK=1:
#   SIM_CLOCK=1 docker compose -f deploy/docker-compose.yml up --build -d
#   cd datagen && uv run python -m elev_datagen generate --dataset planted --scale 0.15 #     --out ../var/seed --mcp-url http://localhost:8080
# Restart without SIM_CLOCK afterwards, so that no client can set record times.
#
# Files are stored by SHA-256 on the shared "files" volume. To use MinIO
# instead, start with "--profile minio" and set OBJECT_STORE=s3 on mcp.

name: revenue-audit

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: audit
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied in name order on first start, as the superuser.
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d audit"]
      interval: 3s
      timeout: 3s
      retries: 30

  ledger:
    build:
      context: ..
      dockerfile: ledger/Dockerfile
    environment:
      DATABASE_URL: postgres://ledger_rw:ledger_rw@db:5432/audit
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token}
      LEDGER_SIM_CLOCK: ${SIM_CLOCK:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  engine:
    build:
      context: ../engine
    environment:
      DATABASE_URL: postgres://engine_audit:engine_audit@db:5432/audit
      LEDGER_URL: http://ledger:7001
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token}
      FILES_DIR: /data/files
      ENGINE_ADDR: :7002
      ENGINE_OUTPUT_DIR: /data/outputs
      # Optional model for evidence extraction and memo wording. OLLAMA_URL is a local model.
      # LLM_URL, LLM_API_KEY and LLM_MODEL are a hosted chat completions service, which takes precedence.
      OLLAMA_URL: ${OLLAMA_URL:-}
      LLM_URL: ${LLM_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      # Optional model that words the assistant's answers. Empty: answers come straight from the records.
      CHAT_MODEL: ${CHAT_MODEL:-}
      CHAT_DAILY_TOKENS: ${CHAT_DAILY_TOKENS:-100000}
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  mcp:
    build:
      context: ..
      dockerfile: mcp/Dockerfile
      target: server
    environment:
      DATABASE_URL: postgres://mcp_read:mcp_read@db:5432/audit
      LEDGER_URL: http://ledger:7001
      ENGINE_URL: http://engine:7002
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-service-token}
      TOKEN_CLIENT: ${TOKEN_CLIENT:-client-demo-token}
      TOKEN_AUDITOR: ${TOKEN_AUDITOR:-auditor-demo-token}
      TOKEN_MANAGER: ${TOKEN_MANAGER:-manager-demo-token}
      TOKEN_SALES: ${TOKEN_SALES:-sales-demo-token}
      TOKEN_DISPATCH: ${TOKEN_DISPATCH:-dispatch-demo-token}
      TOKEN_ACCOUNTS: ${TOKEN_ACCOUNTS:-accounts-demo-token}
      TOKEN_ADMIN: ${TOKEN_ADMIN:-admin-demo-token}
      DEFAULT_ENTITY: ${DEFAULT_ENTITY:-E1}
      OBJECT_STORE: dir
      FILES_DIR: /data/files
      SIM_CLOCK: ${SIM_CLOCK:-0}
      # Report emails through Twilio SendGrid. Without a key and sender, emails are previewed, not sent.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Revenue Audit}
      EMAIL_TO_MANAGER: ${EMAIL_TO_MANAGER:-}
      EMAIL_TO_PARTNER: ${EMAIL_TO_PARTNER:-}
      EMAIL_TO_AUDITOR: ${EMAIL_TO_AUDITOR:-}
      EMAIL_TO_CLIENT: ${EMAIL_TO_CLIENT:-}
      EMAIL_TO_CLIENT_MANAGEMENT: ${EMAIL_TO_CLIENT_MANAGEMENT:-}
    volumes:
      - files:/data/files
    ports:
      - "${MCP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      ledger:
        condition: service_started
    restart: on-failure

  ui:
    build:
      context: ../ui
    ports:
      - "${UI_PORT:-5173}:5173"
    depends_on:
      - mcp

  minio:
    image: minio/minio
    profiles: ["minio"]
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  files:
  miniodata:
