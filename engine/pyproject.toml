[project]
name = "audit-engine"
version = "0.1.0"
description = "ELEV05 audit engine: reconciliation, related parties, sampling, detectors, evidence and outputs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "rapidfuzz>=3.9",
    "networkx>=3.3",
    "pypdf>=4.3",
    "pillow>=10.4",
    "imagehash>=4.3",
    "pytesseract>=0.3.10",
    "pymupdf>=1.24",
    "minio>=7.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audit_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
