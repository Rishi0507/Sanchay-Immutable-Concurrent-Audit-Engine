[project]
name = "elev-datagen"
version = "0.1.0"
description = "ELEV05 synthetic manufacturer, planted irregularities, answer key and self-test"
requires-python = ">=3.12"
dependencies = [
    "audit-engine",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "httpx>=0.27",
]

[tool.uv.sources]
audit-engine = { path = "../engine", editable = true }

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elev_datagen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
